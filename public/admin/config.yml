backend:
  name: git-gateway
  repo: Jirtuoso/jays-blog
  branch: main
  base_url: https://api.netlify.com

media_folder: public
public_folder: public

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home Page
        file: src/content/pages/home.md
        fields:
          - {label: Page heading, name: title, widget: string}
          - label: Homepage text and links
            name: body
            widget: markdown
            modes: [rich_text, raw]
            hint: Use the Link button for hyperlinks. Paragraphs and lists create the page rhythm; use the preview pane to see the layout before publishing.
          - label: Paragraph spacing
            name: spacing
            widget: select
            default: standard
            options:
              - {label: Compact, value: compact}
              - {label: Standard (current layout), value: standard}
              - {label: Spacious, value: spacious}
            hint: Changes the vertical space between paragraphs and lists on the homepage.
          - label: Search and sharing description
            name: description
            widget: text
            hint: A short homepage summary used in page metadata and link previews.

  - name: Writing
    label: Writing
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    fields:
      - {label: Slug, name: slug, widget: string}
      - {label: Title, name: title, widget: string}
      - {label: Description, name: description, widget: text}
      - {label: Date, name: date, widget: datetime}
      - {label: Time, name: tag, widget: string}
      - {label: Body, name: body, widget: markdown}

  - name: gallery
    label: Gallery
    files:
      - name: gallery
        label: Gallery photos
        file: src/data/gallery.json
        format: json
        fields:
          - {label: Page heading, name: title, widget: string}
          - label: Photos
            name: photos
            widget: list
            min: 1
            summary: '{{fields.caption}}'
            fields:
              - label: Photo
                name: src
                widget: image
                choose_url: false
                media_folder: /public/gallery
                public_folder: /gallery
              - {label: Description for accessibility, name: alt, widget: string}
              - {label: Caption, name: caption, widget: string}
              - {label: Original VSCO link, name: source, widget: string, required: false}
              - {label: Image width in pixels, name: width, widget: number, required: false}
              - {label: Image height in pixels, name: height, widget: number, required: false}

  - name: Projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: '{{slug}}'
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Description, name: description, widget: text}
      - {label: Category, name: category, widget: string, hint: 'e.g. GTM, Content, Engineering'}
      - {label: Date, name: date, widget: datetime}
      - {label: Link (optional), name: redirect, widget: string, required: false}

  - name: qa
    label: Q&A
    label_singular: Question
    folder: src/content/qa
    create: true
    slug: '{{slug}}'
    summary: '{{title}} — {{topic}}'
    fields:
      - {label: Question, name: title, widget: string}
      - {label: Topic, name: topic, widget: string, default: General}
      - {label: Date, name: date, widget: datetime}
      - {label: Draft, name: draft, widget: boolean, default: true}
      - {label: Answer, name: body, widget: markdown}
