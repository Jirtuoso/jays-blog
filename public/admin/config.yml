backend:
  name: git-gateway
  repo: Jirtuoso/jays-blog
  branch: main
  base_url: https://api.netlify.com

media_folder: public
public_folder: public

collections:
  - name: Writing
    label: Writing
    folder: src/content/blog
    create: true
    slug: '{{slug}}'
    fields:
      - {label: Slug, name: slug, widget: string}
      - {label: Title, name: title, widget: string}
      - {label: Description, name: description, widget: text}
      - {label: Date, name: date, widget: datetime}
      - {label: Time, name: tag, widget: string}
      - {label: Body, name: body, widget: markdown}

  - name: Projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: '{{slug}}'
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Description, name: description, widget: text}
      - {label: Category, name: category, widget: string, hint: 'e.g. GTM, Content, Engineering'}
      - {label: Date, name: date, widget: datetime}
      - {label: Link (optional), name: redirect, widget: string, required: false}
